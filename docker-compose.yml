services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: invoicebuilder
      POSTGRES_USER: invoicebuilder
      POSTGRES_PASSWORD: invoicebuilder
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicebuilder"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: src/InvoiceBuilder.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=postgres;Database=invoicebuilder;Username=invoicebuilder;Password=invoicebuilder
    ports:
      - "5080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  postgres-data:
