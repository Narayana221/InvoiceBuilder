<div class="mt-3 flex items-center gap-3 text-sm">
  <button
    type="button"
    (click)="previous()"
    [disabled]="page() <= 1"
    class="px-2 py-1 rounded-md border border-slate-200 text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100"
  >
    Previous
  </button>
  <span class="text-slate-500">Page {{ page() }} of {{ totalPages() }} &middot; {{ totalCount() }} total</span>
  <button
    type="button"
    (click)="next()"
    [disabled]="page() >= totalPages()"
    class="px-2 py-1 rounded-md border border-slate-200 text-slate-600 disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-100"
  >
    Next
  </button>
</div>
